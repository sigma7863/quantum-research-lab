[project]
name = "quantum-research-lab"
version = "0.1.0"
description = "A local quantum research portfolio with reproducible experiments."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pennylane>=0.42",
  "pqcrypto>=0.3.4",
  "pymatching>=2.3",
  "scikit-learn>=1.5",
  "stim>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
quantum-lab = "qlab.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

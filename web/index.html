<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quantum Research Lab</title>
    <style>
      :root { color-scheme: dark; --ink: #edf4f1; --muted: #a3b3af; --line: #29413d; --surface: #10211f; --panel: #152b28; --accent: #52d1a7; --accent-2: #f1c85f; --danger: #ff8b86; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; color: var(--ink); background: #091311; font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
      button { font: inherit; }
      .shell { display: grid; min-height: 100vh; grid-template-columns: 240px minmax(0, 1fr); }
      aside { border-right: 1px solid var(--line); padding: 24px 16px; background: #0c1a18; }
      .brand { margin: 0 0 28px; font-size: 18px; letter-spacing: 0; }
      .brand span { display: block; margin-top: 4px; color: var(--accent); font-size: 12px; font-weight: 600; }
      nav { display: grid; gap: 4px; }
      nav button { border: 0; border-left: 2px solid transparent; padding: 10px 12px; color: var(--muted); text-align: left; background: transparent; cursor: pointer; }
      nav button:hover, nav button.active { color: var(--ink); border-left-color: var(--accent); background: #142522; }
      .run-count { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
      main { padding: 32px clamp(20px, 4vw, 64px); }
      .topline { display: flex; align-items: start; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
      h1 { margin: 0; font-size: clamp(25px, 3vw, 36px); font-weight: 650; letter-spacing: 0; }
      .description { max-width: 660px; margin: 8px 0 0; color: var(--muted); }
      .run { flex: 0 0 auto; border: 1px solid #5bdfb5; padding: 10px 16px; background: var(--accent); color: #082018; font-weight: 700; cursor: pointer; }
      .run:disabled { opacity: .55; cursor: wait; }
      .status { min-height: 24px; margin: 18px 0; color: var(--muted); }
      .status.error { color: var(--danger); }
      .metrics { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
      .metric { min-height: 100px; padding: 16px; border: 1px solid var(--line); background: var(--surface); }
      .metric dt { color: var(--muted); font-size: 12px; text-transform: uppercase; }
      .metric dd { margin: 10px 0 0; color: var(--accent-2); font: 600 20px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
      section { margin-top: 28px; }
      h2 { margin: 0 0 12px; font-size: 16px; }
      .record { border: 1px solid var(--line); background: var(--surface); overflow: auto; }
      pre { margin: 0; padding: 16px; color: #c7d9d3; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .empty { padding: 32px; border: 1px dashed var(--line); color: var(--muted); }
      .note { color: var(--muted); font-size: 13px; }
      @media (max-width: 700px) { .shell { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; } .brand { margin-bottom: 14px; } nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } .run-count { display: none; } main { padding: 24px 16px; } .topline { display: grid; } .run { width: 100%; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <h2 class="brand">Quantum Research Lab<span>LOCAL EXPERIMENTS</span></h2>
        <nav id="nav" aria-label="Research areas"></nav>
        <div class="run-count" id="run-count">Stored runs: 0</div>
      </aside>
      <main>
        <div class="topline">
          <div><h1 id="title"></h1><p class="description" id="description"></p></div>
          <button class="run" id="run" type="button">Run experiment</button>
        </div>
        <p class="status" id="status"></p>
        <div class="metrics" id="metrics"></div>
        <section id="detail"></section>
        <section><h2>Latest experiment record</h2><div class="record" id="record"></div></section>
      </main>
    </div>
    <script>
      const state = { modules: {}, results: [], selected: 'qec' };
      const $ = (selector) => document.querySelector(selector);
      const readable = (key) => key.replaceAll('_', ' ').replace(/\b\w/g, (char) => char.toUpperCase());
      const display = (value) => typeof value === 'number' ? (Number.isInteger(value) ? String(value) : value.toFixed(6)) : String(value);
      const latest = () => state.results.find((result) => result.module === state.selected);

      function render() {
        const module = state.modules[state.selected];
        $('#title').textContent = module.name;
        $('#description').textContent = module.description;
        $('#run-count').textContent = `Stored runs: ${state.results.length}`;
        $('#nav').innerHTML = Object.entries(state.modules).map(([key, value]) => `<button class="${key === state.selected ? 'active' : ''}" data-module="${key}">${value.name}</button>`).join('');
        $('#nav').querySelectorAll('button').forEach((button) => button.addEventListener('click', () => { state.selected = button.dataset.module; $('#status').textContent = ''; render(); }));
        const result = latest();
        if (!result) {
          $('#metrics').innerHTML = '';
          $('#detail').innerHTML = '<div class="empty">No local result yet. Run this experiment to create a reproducible JSON record.</div>';
          $('#record').innerHTML = '';
          return;
        }
        $('#metrics').innerHTML = Object.entries(result.metrics).map(([key, value]) => `<dl class="metric"><dt>${readable(key)}</dt><dd>${display(value)}</dd></dl>`).join('');
        const note = result.artifacts.note ? `<p class="note">${result.artifacts.note}</p>` : '';
        $('#detail').innerHTML = `<h2>Interpretation boundary</h2>${note}`;
        $('#record').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
      }

      async function refresh() {
        const response = await fetch('/api/results');
        const payload = await response.json();
        state.modules = payload.modules;
        state.results = payload.results;
        render();
      }

      $('#run').addEventListener('click', async () => {
        const button = $('#run');
        button.disabled = true;
        $('#status').className = 'status';
        $('#status').textContent = `Running ${state.modules[state.selected].name} locally...`;
        try {
          const response = await fetch(`/api/run/${state.selected}`, { method: 'POST' });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || 'Experiment failed');
          state.results.unshift(payload.result);
          $('#status').textContent = 'Result stored locally.';
          render();
        } catch (error) {
          $('#status').className = 'status error';
          $('#status').textContent = error.message;
        } finally { button.disabled = false; }
      });
      refresh().catch((error) => { $('#status').className = 'status error'; $('#status').textContent = error.message; });
    </script>
  </body>
</html>
